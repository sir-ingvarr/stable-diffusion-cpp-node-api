name: Prebuild & Release

on:
  push:
    tags:
      - 'v*'
  # Manual trigger to validate the build matrix on all platforms WITHOUT
  # publishing (the publish job is gated on a tag ref below). Use this to
  # confirm Windows/Linux compile green before cutting a release tag.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  # Build the native binary on every target platform and upload it as an
  # artifact. NOTHING is published here — a failure on any platform must
  # prevent the whole release (see the `publish` job's `needs: build`).
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: macos-latest-large
            platform: darwin
            arch: x64
          # Pinned (not ubuntu-latest): the published linux binary's minimum
          # glibc comes from the build image. ubuntu-latest migrates to
          # Ubuntu 26 from 2026-10-19, which would silently raise the glibc
          # floor for everyone installing the prebuild. Bump deliberately.
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: windows-latest
            platform: win32
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      # Patches are committed with LF line endings (generated on macOS / Linux).
      # On Windows runners core.autocrlf defaults to true, which converts the
      # submodule's .cpp/.hpp files to CRLF on checkout — patches then fail to
      # apply because the context lines don't match. Force LF everywhere
      # before any checkout happens.
      - name: Disable CRLF conversion (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies (skip native build)
        run: npm install --ignore-scripts

      - name: Build native module
        run: npm run build:ci

      # The loader prefers the published platform packages from
      # optionalDependencies; drop them so the tests exercise the binary
      # built above, not a previous release.
      - name: Remove prebuilt binaries so tests load the fresh build
        shell: bash
        run: rm -rf node_modules/@stable-diffusion-cpp-node-api

      # Unit tests need no model file; they load the fresh addon and check
      # the full JS/native surface. Publishing is gated on this via the
      # publish job's `needs: build` — a failure on any platform blocks
      # the release.
      - name: Run unit tests
        run: npm run test:unit

      - name: Stage binary for upload
        shell: bash
        run: |
          set -euo pipefail
          NODE_FILE=$(find build -name "node_stable_diffusion.node" -type f | head -1)
          if [ -z "$NODE_FILE" ]; then
            echo "::error::Could not find node_stable_diffusion.node"
            exit 1
          fi
          mkdir -p artifact
          cp "$NODE_FILE" artifact/node_stable_diffusion.node

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifact/node_stable_diffusion.node
          if-no-files-found: error
          retention-days: 1

  # Runs only if ALL four build jobs succeeded. Publishes every platform
  # package + the meta package and creates the single GitHub release.
  # Because this is one job, there is no race to create the release, and
  # because it `needs: build`, a partial build never publishes anything.
  publish:
    needs: build
    # Only publish on a real tag push. A manual workflow_dispatch run builds
    # the full matrix but skips this job, so you can dry-run the Windows/Linux
    # compile without publishing anything or consuming a version number.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download all platform binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Stage binaries into packages and build release tarballs
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> "$GITHUB_ENV"
          mkdir -p release
          for triple in darwin-arm64 darwin-x64 linux-x64 win32-x64; do
            SRC="artifacts/binary-${triple}/node_stable_diffusion.node"
            if [ ! -f "$SRC" ]; then
              echo "::error::Missing binary for ${triple} — refusing to publish a partial release"
              exit 1
            fi
            cp "$SRC" "npm/${triple}/node_stable_diffusion.node"
            mkdir -p staging/build/Release
            cp "$SRC" staging/build/Release/node_stable_diffusion.node
            tar -czf "release/stable-diffusion-cpp-node-api-v${PACKAGE_VERSION}-napi-v8-${triple}.tar.gz" \
              -C staging build/Release/node_stable_diffusion.node
            rm -rf staging
          done

      # Pull this version's section out of CHANGELOG.md for the release
      # notes. Runs BEFORE any npm publish: a bumped version whose changelog
      # section is missing fails the release while it is still a no-op.
      - name: Extract release notes from CHANGELOG.md
        run: node scripts/extract-changelog.js "$PACKAGE_VERSION" > release_notes.md

      - name: Publish platform packages
        shell: bash
        run: |
          set -euo pipefail
          for triple in darwin-arm64 darwin-x64 linux-x64 win32-x64; do
            echo "Publishing platform package ${triple}"
            ( cd "npm/${triple}" && npm publish --access public --provenance )
          done

      - name: Publish meta package
        run: npm publish --access public --provenance

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*.tar.gz
          body_path: release_notes.md
          draft: false
          fail_on_unmatched_files: true
