# Per-push build status (the README "Build" badge). Compiles the addon on
# one cheap platform and hands the binary to the Tests workflow, which runs
# on its completion — so the native module is only compiled once per push.
# The full four-platform matrix still runs in prebuild.yml before a release.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies (skip native build)
        run: npm install --ignore-scripts

      - name: Build native module (patches applied strictly)
        run: npm run build:ci

      - name: Stage binary for the Tests workflow
        run: |
          set -euo pipefail
          NODE_FILE=$(find build -name "node_stable_diffusion.node" -type f | head -1)
          if [ -z "$NODE_FILE" ]; then
            echo "::error::Could not find node_stable_diffusion.node"
            exit 1
          fi
          mkdir -p artifact
          cp "$NODE_FILE" artifact/node_stable_diffusion.node

      - uses: actions/upload-artifact@v4
        with:
          name: ci-binary
          path: artifact/node_stable_diffusion.node
          if-no-files-found: error
          retention-days: 1
